<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Chama o bootstrap -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>


  <h3><mark>Exemplo de Carosel</mark></h3>
  <h5>Vai aparecer 3 carros icônicos dos Velozos e furiosos.</h5>
  <ul>
    <li>GTR</li>
    <li>Supra</li>
    <li>Eclipse</li>
  </ul>

<!-- Criando o container principal do carousel -->
<div id="demo" class="carousel slide" data-bs-ride="carousel">

  <!-- Indicatores do slide -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div>
  
  <!-- Imagens que vai aparecer -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="imagens/gtr.png" alt="gtr" class="d-block" style="width:500%">
    </div>
    <div class="carousel-item">
      <img src="imagens/supra.png" alt="supra" class="d-block" style="width: 100%">
    </div>
    <div class="carousel-item">
      <img src="imagens/eclipse.png" alt="eclipse" class="d-block" style="width:100%">
    </div>
  </div>
  
  <!-- Botões de ir pra esquerda e direita -->
  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>
</body>
</html>
